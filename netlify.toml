# Netlify serves the React build as a static site. The Go API is not deployed;
# the frontend reads backend/data/profile.json bundled at build time instead.
[build]
  command = "cd frontend && npm ci --no-audit --no-fund && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_STATIC_DATA = "true"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
